# ==============================================================================
# Axis AI Platform - Production Docker Compose (IOSS VPS Deployment)
# ==============================================================================
services:
  # PostgreSQL 16 Production Database
  db:
    image: postgres:16-alpine
    container_name: axis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axis_db}
      POSTGRES_USER: ${POSTGRES_USER:-axis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axis_admin} -d ${POSTGRES_DB:-axis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axis_network

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axis_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axis_admin}:${POSTGRES_PASSWORD:-ChangeThisStrongPassword123!}@db:5432/${POSTGRES_DB:-axis_db}
      SECRET_KEY: ${SECRET_KEY:-AxisSuperSecretKeyForProductionChangeMe2026!}
      ENVIRONMENT: production
      TERMENE_API_KEY: ${TERMENE_API_KEY:-}
      ANAF_API_ENABLED: ${ANAF_API_ENABLED:-true}
      NAMIRIAL_API_KEY: ${NAMIRIAL_API_KEY:-}
      NAMIRIAL_API_URL: ${NAMIRIAL_API_URL:-https://api.namirial.com/v1}
      NAMIRIAL_WEBHOOK_SECRET: ${NAMIRIAL_WEBHOOK_SECRET:-}
      GPS_PROVIDER: ${GPS_PROVIDER:-TrackGPS}
      GPS_API_KEY: ${GPS_API_KEY:-}
    volumes:
      - axis_documents:/app/documents
    depends_on:
      db:
        condition: service_healthy
    networks:
      - axis_network

  # React / Vite Static Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: axis_frontend
    restart: unless-stopped
    networks:
      - axis_network

  # Edge Reverse Proxy (Nginx with Security Headers & Rate Limiting)
  proxy:
    image: nginx:alpine
    container_name: axis_edge_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - axis_network

networks:
  axis_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  axis_documents:
    driver: local
  certs_data:
    driver: local
